name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: frontend
        options:
          - frontend
          - backend
          - both

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  ECS_CLUSTER: burger-club-cluster
  ECS_CONTAINER_NAME: burger-club-api
  ECS_SERVICE: burger-club-api-service
  ECS_TASK_DEFINITION: burger-club-api
  ECR_REPOSITORY: burger-club-api
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy AWS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: burger-club-${{ github.run_id }}

      - name: Build frontend
        if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm --prefix shared ci
          npm --prefix shared run build
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Upload frontend to S3
        if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
        run: aws s3 sync frontend/dist/ "s3://${FRONTEND_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Setup Docker Buildx
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Apply ECR lifecycle policy
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name "${ECR_REPOSITORY}" \
            --lifecycle-policy-text file://infrastructure/aws/ecr-lifecycle-policy.json

      - name: Build and push backend image
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current ECS task definition
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --query taskDefinition \
            > task-definition.json

      - name: Render backend image in task definition
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ env.IMAGE_TAG }}

      - name: Deploy ECS task definition
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
